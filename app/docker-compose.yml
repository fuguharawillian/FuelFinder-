services:
  postgres:
    image: postgres:16-alpine
    container_name: fuelfinder-db
    environment:
      POSTGRES_DB: fuelfinder
      POSTGRES_USER: ${DB_USERNAME:-fuelfinder}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fuelfinder123}
    ports:
      - "5432:5432"
    volumes:
      - fuelfinder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fuelfinder-app
    ports:
      - "8080:8080"
    environment:
      # Sobrescreve as propriedades do Spring Boot para apontar pro container do Postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fuelfinder
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-fuelfinder}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-fuelfinder123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy # Espera o Postgres estar 100% pronto antes de ligar a app
    restart: unless-stopped

volumes:
  fuelfinder_pgdata: