services:
  postgres:
    image: postgres:16-alpine
    container_name: fuelfinder-db
    environment:
      POSTGRES_DB: fuelfinder
      # Development defaults only; use environment variables for other environments.
      POSTGRES_USER: ${DB_USERNAME:-fuelfinder}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fuelfinder123}
    ports:
      - "5432:5432"
    volumes:
      - fuelfinder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  fuelfinder_pgdata:
