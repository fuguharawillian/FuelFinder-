<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalhes do posto — FuelFinder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="/css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/station-detail.js"></script>
</head>
<body>
  <header class="site-header"><div data-site-nav></div></header>
  <main class="page container-fluid px-3 px-xl-4 py-4">
    <p id="page-status" class="result-state" role="status" aria-live="polite" data-shell-status></p>
    <div class="page-heading mb-4"><div><p class="eyebrow mb-1">Informações do estabelecimento</p><h1 id="station-name">Detalhes do posto</h1><p id="station-address" class="text-secondary mb-1"></p><p id="station-rating" class="rating mb-0"></p></div><a class="btn btn-outline-primary" href="/map.html">Voltar ao mapa</a></div>
    <div class="row g-4">
      <div class="col-12 col-xl-6 stack">
        <section class="card border-0 shadow-sm"><div class="card-body p-3 p-lg-4"><h2 class="h5">Preços informativos</h2><p class="text-secondary">Os valores são históricos e não garantem o preço atual na bomba.</p><div id="price-list"></div></div></section>
        <section class="card border-0 shadow-sm"><div class="card-body p-3 p-lg-4"><h2 class="h5">Como chegar</h2><div id="route-links" class="route-actions"></div></div></section>
      </div>
      <div class="col-12 col-xl-6 stack">
        <section class="card border-0 shadow-sm"><div class="card-body p-3 p-lg-4"><h2 class="h5">Avaliações publicadas</h2><div id="review-list"></div></div></section>
        <section id="review-section" class="card border-0 shadow-sm hidden"><div class="card-body p-3 p-lg-4"><h2 class="h5">Avaliar este posto</h2><p class="text-secondary">Sua avaliação será exibida após moderação.</p>
          <p id="review-status" class="result-state" role="status" aria-live="polite"></p>
          <form id="review-form" class="stack">
            <label for="rating">Nota
              <select class="form-select" id="rating" name="rating" required><option value="5">5 — Excelente</option><option value="4">4 — Muito bom</option><option value="3">3 — Bom</option><option value="2">2 — Regular</option><option value="1">1 — Ruim</option></select>
            </label>
            <label for="comment">Comentário (opcional)<textarea class="form-control" id="comment" name="comment" maxlength="500"></textarea></label>
            <button type="submit" class="btn btn-primary align-self-start">Enviar avaliação</button>
          </form>
        </div></section>
      </div>
    </div>
  </main>
</body>
</html>
