<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — FuelFinder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/login-page.js"></script>
</head>
<body data-page-type="login">
  <header class="site-header"><div data-site-nav></div></header>
  <main class="auth-page container d-flex align-items-center justify-content-center py-5">
    <section class="card auth-card border-0 shadow-sm w-100">
      <div class="card-body p-4 p-sm-5">
      <div class="text-center mb-4"><span class="brand-mark mb-3" aria-hidden="true">F</span><p class="eyebrow mb-1">Bem-vindo ao FuelFinder</p><h1 id="auth-heading" class="h2">Acesse sua conta</h1>
      <p class="text-secondary mb-0">Entre para cadastrar veículos, avaliar postos e receber recomendações.</p></div>
      <p id="page-status" class="result-state" role="status" aria-live="polite" data-shell-status></p>
      <form id="auth-form" class="stack" novalidate>
        <label id="full-name-label" class="hidden" for="full-name">Nome completo
          <input class="form-control" id="full-name" name="fullName" autocomplete="name" maxlength="255">
        </label>
        <label for="email">E-mail
          <input class="form-control" id="email" name="email" type="email" autocomplete="email" maxlength="255" required>
        </label>
        <label for="password">Senha
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="password-hint" class="form-text">Na criação da conta: mínimo de 8 caracteres, maiúscula, minúscula, número e caractere especial.</p>
        <div class="d-grid gap-2 mt-3">
          <button id="auth-submit" type="submit" class="btn btn-primary btn-lg">Entrar</button>
          <button id="mode-toggle" type="button" class="btn btn-outline-primary">Criar conta</button>
        </div>
      </form>
      </div>
    </section>
  </main>
</body>
</html>
