<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2794eb">
  <title>FuelFinder — Encontre postos próximos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/home.js"></script>
</head>
<body data-page-type="authenticated">
  <header class="site-header"><div data-site-nav></div></header>
  <main class="page container-fluid px-3 px-xl-4 py-4">
    <div class="page-heading mb-4">
      <div><p class="eyebrow mb-1">Sua próxima parada, mais econômica</p><h1>Encontre combustível perto de você</h1><p class="text-secondary mb-0">Compare postos e confira a data de coleta dos preços.</p></div>
    </div>
    <p id="page-status" class="result-state" role="status" aria-live="polite" data-shell-status></p>
    <section class="card border-0 shadow-sm mb-4" aria-labelledby="search-heading">
      <div class="card-body p-3 p-lg-4">
        <h2 id="search-heading" class="h5 mb-3">Buscar postos</h2>
        <form id="search-form" class="row g-3 align-items-end">
          <div class="col-12 col-md"><label class="form-label" for="location-query">Cidade, bairro ou CEP</label><input class="form-control" id="location-query" name="query" type="search" placeholder="Ex.: 06132-000 ou Pinheiros, São Paulo" autocomplete="street-address"></div>
          <div class="col-12 col-sm-5 col-md-3"><label class="form-label" for="radius">Raio de busca</label><select class="form-select" id="radius" name="radiusKm" aria-label="Raio da busca"><option value="5">5 km</option><option value="10">10 km</option><option value="20">20 km</option><option value="50">50 km</option></select></div>
          <div class="col-12 col-sm-auto d-grid"><button type="submit" class="btn btn-primary px-4" aria-label="Buscar postos por cidade, bairro ou CEP">Buscar postos</button></div>
        </form>
        <div class="mt-3"><button id="gps-button" type="button" class="btn btn-outline-primary" aria-label="Usar minha localização GPS">Usar minha localização</button></div>
      </div>
    </section>
    <div class="row g-4">
      <section class="col-12 col-xl-7" aria-label="Mapa dos postos encontrados"><div class="card border-0 shadow-sm h-100"><div class="card-body p-2"><div id="map" role="application" aria-label="Mapa interativo de postos de combustível"></div></div></div></section>
      <section class="col-12 col-xl-5" aria-labelledby="list-heading"><div class="d-flex align-items-center justify-content-between mb-3"><h2 id="list-heading" class="h5 mb-0">Postos encontrados</h2><span id="station-count" class="badge rounded-pill text-bg-light">—</span></div><div id="station-list" class="station-list" aria-live="polite"><p class="text-secondary">Solicitando sua localização para buscar postos…</p></div></section>
    </div>
  </main>
  <footer class="page-footer border-top mt-4 py-3 px-3 px-xl-4 text-secondary small">Preços são informativos e históricos. Confira sempre a data de coleta.</footer>
</body>
</html>
