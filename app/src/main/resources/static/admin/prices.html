<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de preços — FuelFinder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="/css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/admin-page.js"></script>
</head>
<body data-admin-page="prices">
  <header class="site-header"><div data-site-nav></div></header>
  <main class="page container-fluid px-3 px-xl-4 py-4">
    <div class="page-heading mb-4"><div><p class="eyebrow mb-1">Administração</p><h1>Gestão de preços</h1><p class="text-secondary mb-0">Preços manuais também devem informar a data de coleta.</p></div><a class="btn btn-outline-primary" href="/admin/index.html">Painel</a></div>
    <p id="page-status" class="result-state" role="status" aria-live="polite" data-shell-status></p>
    <section class="card border-0 shadow-sm"><div class="card-body p-3 p-lg-4 stack">
      <form id="price-station-form" class="row g-3 align-items-end">
        <div class="col-12 col-md"><label class="form-label" for="price-station-query">Buscar posto</label><input class="form-control" id="price-station-query" placeholder="Nome, cidade ou bairro"></div>
        <div class="col-12 col-md-auto d-grid"><button type="submit" class="btn btn-outline-primary">Carregar postos</button></div>
      </form>
      <label for="price-station-id">Posto<select class="form-select" id="price-station-id"><option value="">Pesquise postos para escolher</option></select></label>
      <div id="price-entry" class="hidden stack">
        <div><h2 class="h5">Preços atuais do posto</h2><div id="admin-price-list"></div></div>
        <form id="price-form" class="row g-3 align-items-end">
          <label class="col-12 col-md-5" for="fuel-type-code">Combustível<select class="form-select" id="fuel-type-code" name="fuelTypeCode" required>
            <option value="GASOLINE_REGULAR">Gasolina comum</option><option value="GASOLINE_PREMIUM">Gasolina premium/aditivada</option><option value="ETHANOL">Etanol</option><option value="DIESEL_S10">Diesel S10</option><option value="DIESEL_S500">Diesel S500</option><option value="CNG">GNV</option>
          </select></label>
          <label class="col-12 col-md-3" for="sale-value">Preço (R$)<input class="form-control" id="sale-value" name="saleValue" type="number" min="0.001" max="99999.999" step="0.001" required></label>
          <label class="col-12 col-md-4" for="collection-date">Data de coleta<input class="form-control" id="collection-date" name="collectionDate" type="date" required></label>
          <div class="col-12"><button type="submit" class="btn btn-primary">Registrar preço</button></div>
        </form>
      </div>
    </div></section>
  </main>
</body>
</html>
