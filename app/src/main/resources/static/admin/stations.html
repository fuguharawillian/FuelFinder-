<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de postos — FuelFinder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="/css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/admin-page.js"></script>
</head>
<body data-admin-page="stations">
  <header class="site-header"><div data-site-nav></div></header>
  <main class="page container-fluid px-3 px-xl-4 py-4">
    <div class="page-heading mb-4"><div><p class="eyebrow mb-1">Administração</p><h1>Gestão de postos</h1><p class="text-secondary mb-0">Cadastre, consulte e desative postos.</p></div><a class="btn btn-outline-primary" href="/admin/index.html">Painel</a></div>
    <p id="page-status" class="result-state" role="status" aria-live="polite" data-shell-status></p>
    <div class="row g-4">
      <section class="col-12 col-xl-7"><div class="card border-0 shadow-sm"><div class="card-body p-3 p-lg-4"><h2 class="h5 mb-3">Cadastrar posto</h2>
        <form id="station-form" class="row g-3">
          <label class="col-12 col-md-6" for="cnpj">CNPJ<input class="form-control" id="cnpj" name="cnpj" maxlength="18" required></label>
          <label class="col-12 col-md-6" for="corporate-name">Razão social<input class="form-control" id="corporate-name" name="corporateName" maxlength="255" required></label>
          <label class="col-12 col-md-6" for="trade-name">Nome fantasia<input class="form-control" id="trade-name" name="tradeName" maxlength="255"></label>
          <label class="col-12 col-md-6" for="brand">Bandeira<input class="form-control" id="brand" name="brand" maxlength="100"></label>
          <label class="col-12 col-md-6" for="street">Rua<input class="form-control" id="street" name="street" maxlength="255"></label>
          <label class="col-12 col-md-6" for="number">Número<input class="form-control" id="number" name="number" maxlength="20"></label>
          <label class="col-12 col-md-6" for="neighborhood">Bairro<input class="form-control" id="neighborhood" name="neighborhood" maxlength="100"></label>
          <label class="col-12 col-md-6" for="postal-code">CEP<input class="form-control" id="postal-code" name="postalCode" maxlength="10"></label>
          <label class="col-12 col-md-6" for="city">Cidade<input class="form-control" id="city" name="city" maxlength="100" required></label>
          <label class="col-12 col-md-6" for="state">UF<input class="form-control" id="state" name="state" maxlength="2" pattern="[A-Za-z]{2}" required></label>
          <label class="col-12 col-md-6" for="latitude">Latitude<input class="form-control" id="latitude" name="latitude" type="number" min="-90" max="90" step="any" required></label>
          <label class="col-12 col-md-6" for="longitude">Longitude<input class="form-control" id="longitude" name="longitude" type="number" min="-180" max="180" step="any" required></label>
          <div class="col-12"><button type="submit" class="btn btn-primary">Cadastrar posto</button></div>
        </form>
      </div></div></section>
      <section class="col-12 col-xl-5"><h2 class="h5 mb-3">Postos cadastrados</h2>
        <form id="station-search-form" class="row g-2 mb-3">
          <div class="col-12"><label class="form-label" for="station-search">Buscar posto</label><input class="form-control" id="station-search" placeholder="Nome, cidade ou bairro"></div>
          <div class="col-12 d-grid"><button type="submit" class="btn btn-outline-primary">Buscar</button></div>
        </form>
        <div id="admin-station-list" class="stack"></div>
      </section>
    </div>
  </main>
</body>
</html>
