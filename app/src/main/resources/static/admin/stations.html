<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de postos — FuelFinder</title>
  <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/admin-page.js"></script>
</head>
<body data-admin-page="stations">
  <header class="site-header"><div data-site-nav></div></header>
  <main class="page">
    <div class="page-heading"><div><h1>Gestão de postos</h1><p class="muted">Cadastre, consulte e desative postos.</p></div><a class="button secondary" href="/admin/index.html">Painel</a></div>
    <p id="page-status" class="result-state" role="status" aria-live="polite" data-shell-status></p>
    <div class="home-grid">
      <section class="panel"><h2>Cadastrar posto</h2>
        <form id="station-form" class="form-grid">
          <label for="cnpj">CNPJ<input id="cnpj" name="cnpj" maxlength="18" required></label>
          <label for="corporate-name">Razão social<input id="corporate-name" name="corporateName" maxlength="255" required></label>
          <label for="trade-name">Nome fantasia<input id="trade-name" name="tradeName" maxlength="255"></label>
          <label for="brand">Bandeira<input id="brand" name="brand" maxlength="100"></label>
          <label for="street">Rua<input id="street" name="street" maxlength="255"></label>
          <label for="number">Número<input id="number" name="number" maxlength="20"></label>
          <label for="neighborhood">Bairro<input id="neighborhood" name="neighborhood" maxlength="100"></label>
          <label for="postal-code">CEP<input id="postal-code" name="postalCode" maxlength="10"></label>
          <label for="city">Cidade<input id="city" name="city" maxlength="100" required></label>
          <label for="state">UF<input id="state" name="state" maxlength="2" pattern="[A-Za-z]{2}" required></label>
          <label for="latitude">Latitude<input id="latitude" name="latitude" type="number" min="-90" max="90" step="any" required></label>
          <label for="longitude">Longitude<input id="longitude" name="longitude" type="number" min="-180" max="180" step="any" required></label>
          <div class="full"><button type="submit">Cadastrar posto</button></div>
        </form>
      </section>
      <section><h2>Postos cadastrados</h2>
        <form id="station-search-form" class="search-row mb-4">
          <label class="sr-only" for="station-search">Buscar posto</label><input id="station-search" placeholder="Nome, cidade ou bairro">
          <button type="submit">Buscar</button>
        </form>
        <div id="admin-station-list" class="stack"></div>
      </section>
    </div>
  </main>
</body>
</html>
