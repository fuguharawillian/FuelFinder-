<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moderação de avaliações — FuelFinder</title>
  <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/admin-page.js"></script>
</head>
<body data-admin-page="reviews">
  <header class="site-header"><div data-site-nav></div></header>
  <main class="page-narrow">
    <div class="page-heading"><div><h1>Moderação de avaliações</h1><p class="muted">Aprove ou rejeite uma avaliação pelo ID.</p></div><a class="button secondary" href="/admin/index.html">Painel</a></div>
    <p id="page-status" class="result-state" role="status" aria-live="polite" data-shell-status></p>
    <section class="panel stack">
      <div class="form-actions">
        <label for="review-status-filter">Filtrar por status<select id="review-status-filter"><option value="PENDING">Pendentes</option><option value="APPROVED">Aprovadas</option><option value="REJECTED">Rejeitadas</option></select></label>
        <button id="refresh-reviews" type="button" class="secondary">Atualizar lista</button>
      </div>
      <div id="moderation-list" class="stack" aria-live="polite"></div>
      <form id="review-moderation-form" class="stack">
        <label for="review-id">ID da avaliação (UUID)<input id="review-id" name="reviewId" autocomplete="off" required></label>
        <label for="review-status">Decisão<select id="review-status" name="reviewStatus"><option value="APPROVED">Aprovar</option><option value="REJECTED">Rejeitar</option></select></label>
        <button type="submit">Salvar decisão</button>
      </form>
    </section>
  </main>
</body>
</html>
