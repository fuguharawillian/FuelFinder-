<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus veículos — FuelFinder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="/css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/vehicles-page.js"></script>
</head>
<body>
  <header class="site-header"><div data-site-nav></div></header>
  <main class="page container-fluid px-3 px-xl-4 py-4">
    <div class="page-heading mb-4"><div><p class="eyebrow mb-1">Seu perfil de direção</p><h1>Meus veículos</h1><p class="text-secondary mb-0">Informe capacidade e consumo para personalizar as recomendações.</p></div></div>
    <p id="page-status" class="result-state" role="status" aria-live="polite" data-shell-status></p>
    <div class="row g-4">
      <section class="col-12 col-xl-5"><div class="card border-0 shadow-sm h-100"><div class="card-body p-3 p-lg-4">
        <h2 class="h5 mb-3">Cadastrar veículo</h2>
        <form id="vehicle-form" class="stack">
          <div class="row g-3">
            <label class="col-12 col-md-6" for="nickname">Apelido<input class="form-control" id="nickname" name="nickname" minlength="2" maxlength="50" required></label>
            <label class="col-12 col-md-6" for="brand">Marca<input class="form-control" id="brand" name="brand" maxlength="100" required></label>
            <label class="col-12 col-md-6" for="model">Modelo<input class="form-control" id="model" name="model" maxlength="100" required></label>
            <label class="col-12 col-md-6" for="year-manufacture">Ano<input class="form-control" id="year-manufacture" name="yearManufacture" type="number" min="1950" max="2100" required></label>
            <label class="col-12 col-md-6" for="fuel-type">Combustível
              <select class="form-select" id="fuel-type" name="fuelTypeAccepted" required>
                <option value="FLEX">Flex</option><option value="GASOLINE">Gasolina</option><option value="ETHANOL">Etanol</option><option value="DIESEL">Diesel</option><option value="CNG">GNV</option>
              </select>
            </label>
            <label class="col-12 col-md-6" for="tank-capacity">Capacidade do tanque (<span id="capacity-unit">L</span>)
              <input class="form-control" id="tank-capacity" name="tankCapacity" type="number" min="0.01" step="0.01" required>
            </label>
          </div>
          <fieldset class="border rounded-3 p-3"><legend class="float-none w-auto px-2 fs-6 fw-semibold">Consumo médio</legend><div id="consumption-fields" class="row g-3"></div><p class="form-text mb-0">Informe km/L para combustíveis líquidos ou km/m³ para GNV.</p></fieldset>
          <button type="submit" class="btn btn-primary align-self-start" aria-label="Cadastrar veículo">Cadastrar veículo</button>
        </form>
      </div></div></section>
      <section class="col-12 col-xl-7"><h2 class="h5 mb-3">Veículos cadastrados</h2><div id="vehicle-list" class="stack"></div></section>
    </div>
  </main>
</body>
</html>
