<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recomendações — FuelFinder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="/css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/recommendations-page.js"></script>
</head>
<body>
  <header class="site-header"><div data-site-nav></div></header>
  <main class="page container-fluid px-3 px-xl-4 py-4">
    <div class="page-heading mb-4"><div><p class="eyebrow mb-1">Escolha com mais confiança</p><h1>Recomendação personalizada</h1><p class="text-secondary mb-0">Compare opções com base no seu veículo, consumo e distância.</p></div></div>
    <p id="page-status" class="result-state" role="status" aria-live="polite" data-shell-status></p>
    <section class="card border-0 shadow-sm"><div class="card-body p-3 p-lg-4">
      <form id="recommendation-form" class="stack">
        <div class="row g-3">
          <label class="col-12 col-md-6" for="vehicle-id">Veículo<select class="form-select" id="vehicle-id" name="vehicleId" required><option value="">Carregando veículos…</option></select></label>
          <label class="col-12 col-md-6" for="radius-km">Raio de busca (km)<input class="form-control" id="radius-km" name="radiusKm" type="number" min="0.1" max="100" step="0.1" value="5" required></label>
          <label class="col-12 col-md-6" for="latitude">Latitude<input class="form-control" id="latitude" name="latitude" type="number" min="-90" max="90" step="any" required placeholder="-23.5505"></label>
          <label class="col-12 col-md-6" for="longitude">Longitude<input class="form-control" id="longitude" name="longitude" type="number" min="-180" max="180" step="any" required placeholder="-46.6333"></label>
        </div>
        <div class="d-flex flex-column flex-sm-row gap-2 mt-3">
          <button type="button" id="use-current-location" class="btn btn-outline-primary">Usar minha localização</button>
          <button type="submit" class="btn btn-primary">Calcular recomendação</button>
        </div>
      </form>
    </div></section>
    <div id="recommendation-result" class="stack mt-4" aria-live="polite"></div>
  </main>
  <script type="module">
    document.getElementById("use-current-location").addEventListener("click", () => {
      const status = document.getElementById("page-status");
      if (!navigator.geolocation) { status.textContent = "Este navegador não oferece geolocalização."; return; }
      status.textContent = "Solicitando sua localização…";
      navigator.geolocation.getCurrentPosition(({ coords }) => {
        document.getElementById("latitude").value = coords.latitude;
        document.getElementById("longitude").value = coords.longitude;
        status.textContent = "Localização preenchida.";
      }, () => { status.textContent = "Localização indisponível. Informe as coordenadas manualmente."; }, { timeout: 10000 });
    });
  </script>
</body>
</html>
