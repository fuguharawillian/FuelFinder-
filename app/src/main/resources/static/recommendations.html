<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recomendações — FuelFinder</title>
  <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/recommendations-page.js"></script>
</head>
<body>
  <header class="site-header"><div data-site-nav></div></header>
  <main class="page">
    <div class="page-heading"><div><h1>Recomendação personalizada</h1><p class="muted">Compare opções com base no seu veículo, consumo e distância.</p></div></div>
    <p id="page-status" class="result-state" role="status" aria-live="polite" data-shell-status></p>
    <section class="panel">
      <form id="recommendation-form" class="stack">
        <div class="form-grid">
          <label for="vehicle-id">Veículo<select id="vehicle-id" name="vehicleId" required><option value="">Carregando veículos…</option></select></label>
          <label for="radius-km">Raio de busca (km)<input id="radius-km" name="radiusKm" type="number" min="0.1" max="100" step="0.1" value="5" required></label>
          <label for="latitude">Latitude<input id="latitude" name="latitude" type="number" min="-90" max="90" step="any" required placeholder="-23.5505"></label>
          <label for="longitude">Longitude<input id="longitude" name="longitude" type="number" min="-180" max="180" step="any" required placeholder="-46.6333"></label>
        </div>
        <div class="form-actions">
          <button type="button" id="use-current-location" class="secondary">Usar minha localização</button>
          <button type="submit">Calcular recomendação</button>
        </div>
      </form>
    </section>
    <div id="recommendation-result" class="stack mt-4" aria-live="polite"></div>
  </main>
  <script type="module">
    document.getElementById("use-current-location").addEventListener("click", () => {
      const status = document.getElementById("page-status");
      if (!navigator.geolocation) { status.textContent = "Este navegador não oferece geolocalização."; return; }
      status.textContent = "Solicitando sua localização…";
      navigator.geolocation.getCurrentPosition(({ coords }) => {
        document.getElementById("latitude").value = coords.latitude;
        document.getElementById("longitude").value = coords.longitude;
        status.textContent = "Localização preenchida.";
      }, () => { status.textContent = "Localização indisponível. Informe as coordenadas manualmente."; }, { timeout: 10000 });
    });
  </script>
</body>
</html>
