<div class="modal fade" id="add_items" tabindex="-1" aria-labelledby="add_items" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Items</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <div class="col-lg-12 col-md-12">
                        <div class="form-floating">
                            <input type="text" class="form-control" placeholder="Name">
                            <label>Name *</label>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-12">
                        <div class="form-floating">
                            <input type="text" class="form-control" placeholder="Code *">
                            <label>Code *</label>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-12">
                        <div class="form-floating">
                            <input type="text" class="form-control" placeholder="Quantity">
                            <label>Quantity *</label>
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-12">
                        <div class="form-floating">
                            <select class="form-select">
                                <option>Standard</option>
                                <option>Combo</option>
                                <option>Digital</option>
                                <option>Service</option>
                            </select>
                            <label for="floatingSelect">Product Type *</label>
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-12">
                        <div class="form-floating">
                            <select class="form-select">
                                <option>P0112</option>
                                <option>M0876</option>
                                <option>JK098</option>
                                <option>SS094</option>
                                <option>RT990</option>
                            </select>
                            <label for="floatingSelect">Barcode Symbology *</label>
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-12">
                        <div class="form-floating">
                            <select class="form-select">
                                <option>Beauty</option>
                                <option>Grocery</option>
                                <option>Frames</option>
                                <option>Jewellery</option>
                                <option>Food</option>
                                <option>Furniture</option>
                                <option>Shoes</option>
                            </select>
                            <label for="floatingSelect">Category *</label>
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-12">
                        <div class="form-floating">
                            <select class="form-select">
                                <option>Inclusive</option>
                                <option>Exclusive</option>
                            </select>
                            <label for="floatingSelect">Tax Method *</label>
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-12">
                        <div class="form-floating">
                            <input type="text" class="form-control" placeholder="Cost">
                            <label>Cost *</label>
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-12">
                        <div class="form-floating">
                            <input type="text" class="form-control" placeholder="Price">
                            <label>Price *</label>
                        </div>
                    </div>
                    <div class="col-lg-12">
                        <label for="formFile" class="form-label">Attach Image</label>
                        <input class="form-control" type="file" id="formFile">
                    </div>
                    <div class="col-lg-12 col-md-12">
                        <div class="form-floating">
                            <textarea type="text" class="form-control" placeholder="Description" style="height: 100px"></textarea>
                            <label>Description / Product Details *</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary">Submit</button>
            </div>
        </div>
    </div>
</div>
