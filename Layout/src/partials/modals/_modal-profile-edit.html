<div class="offcanvas offcanvas-end" tabindex="-1" id="edit_profile">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Edit details</h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <form class="row g-3">
            <div class="col-md-12">
                <div class="image-input avatar xxl rounded-4" style="background-image: url(@@webRoot/assets/img/avatar.png)">
                    <div class="avatar-wrapper rounded-4"></div>
                    <div class="file-input">
                        <input type="file" class="form-control" name="file-input" id="file-input">
                        <label for="file-input" class="fa fa-pencil shadow"></label>
                    </div>
                </div>
            </div>
            <div class="col-md-12">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" placeholder="Allie Grater">
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="alliegrater@luno.com">
            </div>
            <div class="col-md-6">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="ChrisMorise">
            </div>
            <div class="col-12">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" placeholder="1234 Main St">
            </div>
            <div class="col-12">
                <label class="form-label">Address 2</label>
                <input type="text" class="form-control" placeholder="Apartment, studio, or floor">
            </div>
            <div class="col-md-6">
                <label class="form-label">City</label>
                <input type="text" class="form-control" placeholder="New york">
            </div>
            <div class="col-md-6">
                <label class="form-label">State</label>
                <select class="form-select">
                    <option selected>Choose...</option>
                    <option>...</option>
                </select>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Update Details</button>
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="offcanvas">Cancel</button>
            </div>
        </form>
    </div>
</div>
