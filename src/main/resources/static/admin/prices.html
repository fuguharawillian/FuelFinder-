<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de preços — FuelFinder</title>
  <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/admin-page.js"></script>
</head>
<body data-admin-page="prices">
  <header class="site-header"><div data-site-nav></div></header>
  <main class="page-narrow">
    <div class="page-heading"><div><h1>Gestão de preços</h1><p class="muted">Preços manuais também devem informar a data de coleta.</p></div><a class="button secondary" href="/admin/index.html">Painel</a></div>
    <p id="page-status" class="result-state" role="status" aria-live="polite" data-shell-status></p>
    <section class="panel stack">
      <form id="price-station-form" class="search-row">
        <label class="sr-only" for="price-station-query">Buscar posto</label><input id="price-station-query" placeholder="Buscar posto por nome, cidade ou bairro">
        <button type="submit">Carregar postos</button>
      </form>
      <label for="price-station-id">Posto<select id="price-station-id"><option value="">Pesquise postos para escolher</option></select></label>
      <div id="price-entry" class="hidden stack">
        <h2>Preços atuais do posto</h2><div id="admin-price-list"></div>
        <form id="price-form" class="form-grid">
          <label for="fuel-type-code">Combustível<select id="fuel-type-code" name="fuelTypeCode" required>
            <option value="GASOLINE_REGULAR">Gasolina comum</option><option value="GASOLINE_PREMIUM">Gasolina premium/aditivada</option><option value="ETHANOL">Etanol</option><option value="DIESEL_S10">Diesel S10</option><option value="DIESEL_S500">Diesel S500</option><option value="CNG">GNV</option>
          </select></label>
          <label for="sale-value">Preço (R$)<input id="sale-value" name="saleValue" type="number" min="0.001" max="99999.999" step="0.001" required></label>
          <label for="collection-date">Data de coleta<input id="collection-date" name="collectionDate" type="date" required></label>
          <div class="full"><button type="submit">Registrar preço</button></div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
