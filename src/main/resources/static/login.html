<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — FuelFinder</title>
  <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/login-page.js"></script>
</head>
<body>
  <header class="site-header"><div data-site-nav></div></header>
  <main class="page-narrow">
    <section class="panel">
      <h1 id="auth-heading">Acesse sua conta</h1>
      <p class="muted">Entre para cadastrar veículos, avaliar postos e receber recomendações.</p>
      <p id="page-status" class="result-state" role="status" aria-live="polite" data-shell-status></p>
      <form id="auth-form" class="stack" novalidate>
        <label id="full-name-label" class="hidden" for="full-name">Nome completo
          <input id="full-name" name="fullName" autocomplete="name" maxlength="255">
        </label>
        <label for="email">E-mail
          <input id="email" name="email" type="email" autocomplete="email" maxlength="255" required>
        </label>
        <label for="password">Senha
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="password-hint" class="muted">Na criação da conta: mínimo de 8 caracteres, maiúscula, minúscula, número e caractere especial.</p>
        <div class="form-actions">
          <button id="auth-submit" type="submit">Entrar</button>
          <button id="mode-toggle" type="button" class="secondary">Criar conta</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
