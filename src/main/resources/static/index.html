<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c8052">
  <title>FuelFinder — Encontre postos próximos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/js/home.js"></script>
</head>
<body>
  <header class="site-header"><div data-site-nav></div></header>
  <main class="page">
    <div class="page-heading">
      <div><h1>Encontre combustível perto de você</h1><p class="muted">Compare postos e confira a data de coleta dos preços.</p></div>
    </div>
    <p id="page-status" class="result-state" role="status" aria-live="polite" data-shell-status></p>
    <section class="panel mb-4" aria-labelledby="search-heading">
      <h2 id="search-heading">Buscar postos</h2>
      <form id="search-form" class="search-row">
        <label class="sr-only" for="location-query">Cidade, bairro ou CEP</label>
        <input id="location-query" name="query" type="search" placeholder="Cidade, bairro ou CEP" autocomplete="street-address">
        <label class="sr-only" for="radius">Raio de busca</label>
        <select id="radius" name="radiusKm" aria-label="Raio da busca">
          <option value="5">5 km</option><option value="10">10 km</option><option value="20">20 km</option><option value="50">50 km</option>
        </select>
        <button type="submit" aria-label="Buscar postos por cidade, bairro ou CEP">Buscar</button>
      </form>
      <div class="form-actions"><button id="gps-button" type="button" class="secondary" aria-label="Usar minha localização GPS">Usar minha localização</button></div>
    </section>
    <div class="home-grid">
      <section aria-label="Mapa dos postos encontrados"><div id="map" role="application" aria-label="Mapa interativo de postos de combustível"></div></section>
      <section aria-labelledby="list-heading">
        <h2 id="list-heading">Postos encontrados</h2>
        <div id="station-list" class="station-list" aria-live="polite"><p class="muted">Use a busca ou o GPS para encontrar postos.</p></div>
      </section>
    </div>
  </main>
  <footer>Preços são informativos e históricos. Confira sempre a data de coleta.</footer>
</body>
</html>
