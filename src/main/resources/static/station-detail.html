<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalhes do posto — FuelFinder</title>
  <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/station-detail.js"></script>
</head>
<body>
  <header class="site-header"><div data-site-nav></div></header>
  <main class="page">
    <p id="page-status" class="result-state" role="status" aria-live="polite" data-shell-status></p>
    <div class="page-heading"><div><h1 id="station-name">Detalhes do posto</h1><p id="station-address" class="muted"></p><p id="station-rating" class="rating"></p></div><a class="button secondary" href="/index.html">Voltar ao mapa</a></div>
    <div class="home-grid">
      <div class="stack">
        <section class="panel"><h2>Preços informativos</h2><p class="muted">Os valores são históricos e não garantem o preço atual na bomba.</p><div id="price-list"></div></section>
        <section class="panel"><h2>Como chegar</h2><div id="route-links" class="route-actions"></div></section>
      </div>
      <div class="stack">
        <section class="panel"><h2>Avaliações publicadas</h2><div id="review-list"></div></section>
        <section id="review-section" class="panel hidden"><h2>Avaliar este posto</h2><p class="muted">Sua avaliação será exibida após moderação.</p>
          <p id="review-status" class="result-state" role="status" aria-live="polite"></p>
          <form id="review-form" class="stack">
            <label for="rating">Nota
              <select id="rating" name="rating" required><option value="5">5 — Excelente</option><option value="4">4 — Muito bom</option><option value="3">3 — Bom</option><option value="2">2 — Regular</option><option value="1">1 — Ruim</option></select>
            </label>
            <label for="comment">Comentário (opcional)<textarea id="comment" name="comment" maxlength="500"></textarea></label>
            <button type="submit">Enviar avaliação</button>
          </form>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
